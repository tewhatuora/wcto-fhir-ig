id: tewhatuora.wcto
canonical: https://fhir-ig.digital.health.nz/wcto
name: WCTO
title: Well Child Tamariki Ora FHIR Implementation Guide
description: FHIR Implementation Guide for digital Well Child Tamariki Ora services, with B4 School Check as the initial use case.
status: active # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 4.0.1 # https://www.hl7.org/fhir/valueset-FHIR-version.html
copyrightYear: 2026+
releaseLabel: release
# license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
jurisdiction: urn:iso:std:iso:3166#NZ "New Zealand"
publisher:
  name: Health New Zealand | Te Whatu Ora
  url: https://www.healthnz.govt.nz/

dependencies:
  fhir.org.nz.ig.base:
    uri: http://fhir.org.nz/ig/base/ImplementationGuide/fhir.org.nz.ig.base
    version: 3.0.1
  hl7.fhir.uv.sdc: 3.0.0
  tewhatuora.digitaltooling: 0.0.11
  hl7.terminology.r4: 6.5.0

parameters:
  show-inherited-invariants: false
  usage-stats-opt-out: true
  excludettl: true
  apply-version: false
  default-version: true



