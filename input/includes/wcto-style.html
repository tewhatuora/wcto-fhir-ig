<style>

/* =========================================================
   WCTO SHARED CONTENT STYLE
   ========================================================= */


/* ---------------------------------------------------------
   HEADINGS
   Keep template font, size and colour.
   Only control spacing.
   --------------------------------------------------------- */

h3,
h4 {
  clear: none !important;
}

h3 {
  margin-top: 14px !important;
  margin-bottom: 6px !important;
}

h4 {
  margin-top: 12px !important;
  margin-bottom: 5px !important;
}


/* ---------------------------------------------------------
   BODY CONTENT
   --------------------------------------------------------- */

p {
  margin-top: 0;
  margin-bottom: 8px;
  color: #000000;
  line-height: 1.45;
}

ul,
ol {
  margin-top: 4px;
  margin-bottom: 8px;
  padding-left: 22px;
  line-height: 1.45;
}

li {
  margin-bottom: 2px;
  color: #000000;
}


/* ---------------------------------------------------------
   TABLES
   Simple Shared Care-style table
   --------------------------------------------------------- */

table {
  width: 100%;
  margin: 10px 0 16px;
  border-collapse: collapse;
  background: #ffffff;
  border: 1px solid #c7c7c7;
}

table th {
  padding: 6px 8px;

  background: #1c3f6e !important;
  color: #ffffff !important;

  border: 1px solid #1c3f6e;

  text-align: left;
  vertical-align: top;

  font-weight: 700;
  line-height: 1.3;
}

table td {
  padding: 5px 8px;

  background: #ffffff !important;
  color: #000000;

  border: 1px solid #c7c7c7;

  vertical-align: top;
  line-height: 1.35;
}


/* Keep all rows white */

table tbody tr:nth-child(even) td,
table tbody tr:nth-child(odd) td {
  background: #ffffff !important;
}


/* Compact table content */

table td p,
table th p {
  margin: 0 0 3px;
}

table td p:last-child,
table th p:last-child {
  margin-bottom: 0;
}

table td ul,
table td ol {
  margin: 2px 0 2px 17px;
  padding: 0;
}

table td li {
  margin-bottom: 1px;
}


/* ---------------------------------------------------------
   NOTES / CALLOUTS
   Plain, no coloured left line
   --------------------------------------------------------- */

blockquote {
  margin: 8px 0 12px;
  padding: 8px 10px;

  background: #f7f7f7;

  border: 1px solid #dddddd !important;
  border-left: 1px solid #dddddd !important;

  color: #000000;
}

blockquote p {
  margin: 0;
  color: #000000;
}


/* ---------------------------------------------------------
   FLOW DIAGRAMS
   Neutral box, no blue/teal vertical line
   --------------------------------------------------------- */

pre {
  display: block;

  width: 100%;
  box-sizing: border-box;

  margin: 8px 0 12px;
  padding: 10px 12px;

  overflow-x: auto;

  background: #fafafa !important;

  border: 1px solid #d5d5d5 !important;
  border-left: 1px solid #d5d5d5 !important;

  border-radius: 2px;

  color: #000000 !important;

  font-family: Consolas, "Courier New", monospace;
  font-size: 11.5px;
  line-height: 1.22;

  white-space: pre;
}

pre code {
  margin: 0 !important;
  padding: 0 !important;

  background: transparent !important;

  border: 0 !important;

  color: #000000 !important;

  font-family: inherit;
  font-size: inherit;
}


/* ---------------------------------------------------------
   MOBILE
   --------------------------------------------------------- */

@media (max-width: 760px) {

  table {
    font-size: 13px;
  }

  table th,
  table td {
    padding: 5px 6px;
  }

  pre {
    padding: 8px;
    font-size: 10.5px;
  }

}

</style>
